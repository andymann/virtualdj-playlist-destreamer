<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Angelehnt an den VirtualDJ-Look (rote Hülle + Platte), eigenes Motiv:
       Stream-Wellen auf der Hülle, Pfeil nach unten (= lokal) auf dem Label -->
  <defs>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#1c1c1c"/>
      <stop offset="0.85" stop-color="#0a0a0a"/>
      <stop offset="1"    stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a1f"/>
      <stop offset="1" stop-color="#c8000a"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b2f"/>
      <stop offset="1" stop-color="#b3000a"/>
    </linearGradient>
  </defs>

  <!-- Platte (schaut rechts aus der Hülle) -->
  <circle cx="660" cy="512" r="300" fill="url(#disc)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4">
    <circle cx="660" cy="512" r="275"/>
    <circle cx="660" cy="512" r="250"/>
    <circle cx="660" cy="512" r="225"/>
    <circle cx="660" cy="512" r="200"/>
    <circle cx="660" cy="512" r="175"/>
    <circle cx="660" cy="512" r="150"/>
  </g>
  <path d="M 660 512 L 872 300 A 300 300 0 0 1 960 512 Z" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="660" cy="512" r="118" fill="url(#label)"/>
  <circle cx="660" cy="512" r="118" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="6"/>
  <path d="M 712 470 L 712 560 M 682 532 L 712 562 L 742 532" fill="none"
        stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Schatten der Hülle auf der Platte -->
  <rect x="640" y="212" width="28" height="600" fill="#000000" fill-opacity="0.45"/>

  <!-- Hülle -->
  <rect x="64" y="212" width="600" height="600" rx="18" fill="url(#sleeve)"/>
  <rect x="64" y="212" width="600" height="600" rx="18" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Stream-Wellen in Weiß -->
  <circle cx="230" cy="378" r="44" fill="#ffffff"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="46">
    <path d="M 370 378 A 140 140 0 0 1 230 518"/>
    <path d="M 480 378 A 250 250 0 0 1 230 628"/>
    <path d="M 590 378 A 360 360 0 0 1 230 738"/>
  </g>
</svg>
